name = "tabula"
description = "Tables in and out: TOML and CSV, read and written, over a proven core"
version = "0.1.0"

authors = ["Lenny Maiorani"]
maintainers = ["Lenny Maiorani <639247+ldm5180@users.noreply.github.com>"]
maintainers-logins = ["ldm5180"]
licenses = "MIT"
website = "https://github.com/ldm5180/tabula"
tags = ["toml", "csv", "config", "parser", "spark"]

project-files = ["tabula.gpr"]

[[depends-on]]
ada_toml = "~0.5.0"
aunit = "^26.0.0"
fabula = "*"
sml = "*"

#  ada_toml: pinned one commit past the v0.5 tag, to upstream's fix for
#  the fraction leading-zero bug (0.02 parsed as 0.2 -- PR #17); the
#  index has no release carrying it.  The quoted-decimal knob form
#  predates this pin and stays supported.
[[pins]]
ada_toml = { url = "https://github.com/pmderodat/ada-toml.git", commit = "485b71c8c5d58cbdafeb925afbbe22590a2eada2" }

#  fabula, the Gherkin runner the features under tests/features/ run on,
#  is a TEST dependency and not in the community index either.  Pinned by
#  commit; it brings its own sml pin.  The CSV scanner is an sml machine,
#  so tabula depends on sml too, but takes fabula's pin rather than
#  naming its own: should tabula ever pin sml itself the two must name
#  one commit, since alr refuses two links to one crate at different
#  commits.
fabula = { url = "https://github.com/ldm5180/fabula.git", commit = "746a234df5581c2e38c4202aeee8b07473fb6a51" }

[build-switches]
"*".ada_version = "Ada2022"

#  `alr test` runs actions with an empty GPR_PROJECT_PATH, so each wraps its
#  command in `alr exec --` to pick up the toolchain, ada_toml and AUnit.
#  Argv-only actions (no `sh -c`, no `&&`) so this runs on Windows too; the
#  runner exits non-zero on any failing assertion, so a failure fails the
#  job.  The suite is built and run in both optimization modes (release -O3,
#  debug -O0), selected by the MODE external (sml-ada convention), so the
#  library is exercised at each -O level.
[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=release", "-P", "tests/test_tabula.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/release/test_runner"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "gprbuild", "-p", "-j0", "-XMODE=debug", "-P", "tests/test_tabula.gpr"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/debug/test_runner"]

#  The Gherkin features, after the suite: each gprbuild above already
#  built tabula_features beside test_runner.  fabula exits 1 on any
#  failed or undefined scenario; `make features` also checks the summary
#  line, since a missing path or an empty file exits 0 by design.
[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/release/tabula_features", "tests/features"]

[[actions]]
type = "test"
command = ["alr", "exec", "--", "tests/bin/debug/tabula_features", "tests/features"]
